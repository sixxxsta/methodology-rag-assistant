# Микросервисы: web (Next.js) → gateway (API) → rag → qdrant + inference (gpu)

services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: methodology-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  inference:
    profiles: ["gpu"]
    build:
      context: ./services/inference
      dockerfile: Dockerfile
    image: methodology-inference:latest
    container_name: methodology-inference
    env_file: .env
    ports:
      - "${INFERENCE_PORT:-8000}:8000"
    volumes:
      - inference_cache:/models/hf-cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  rag:
    build:
      context: ./services/rag
      dockerfile: Dockerfile
    image: methodology-rag:latest
    container_name: methodology-rag
    env_file: .env
    ports:
      - "${RAG_PORT:-8100}:8100"
    volumes:
      - ./knowledge:/knowledge:ro
      - rag_data:/app/data
      - embedding_cache:/models/hf-cache
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 300s
    restart: unless-stopped

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    image: methodology-gateway:latest
    container_name: methodology-gateway
    env_file: .env
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    environment:
      RAG_SERVICE_URL: http://rag:8100
      KNOWLEDGE_DIR: /knowledge
      AUTH_DB_PATH: /app/data/users.db
    volumes:
      - ./knowledge:/knowledge
      - gateway_data:/app/data
    depends_on:
      - rag
    restart: unless-stopped

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    image: methodology-web:latest
    container_name: methodology-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: http://gateway:8090
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  qdrant_data:
  rag_data:
  embedding_cache:
  inference_cache:
  gateway_data:
